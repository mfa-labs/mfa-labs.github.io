<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" role="img" aria-label="Flowchart menghitung nilai akhir mata kuliah dari empat komponen berbobot">
  <defs>
    <marker id="ar-nilai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3034"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #2b3034; stroke-width: 2; }
    .start { fill: #e8f4ef; stroke: #006c4a; stroke-width: 2; }
    .io { fill: #eef3f8; stroke: #2b3034; stroke-width: 2; }
    .t { font-family: Inter, system-ui, sans-serif; font-size: 18px; fill: #14181b; text-anchor: middle; dominant-baseline: middle; }
    .line { stroke: #2b3034; stroke-width: 2; fill: none; }
  </style>

  <rect class="start" x="150" y="30" width="340" height="54" rx="27"/>
  <text class="t" x="320" y="58">Mulai</text>

  <line class="line" x1="320" y1="84" x2="320" y2="118" marker-end="url(#ar-nilai)"/>

  <polygon class="io" points="168,124 490,124 472,186 150,186"/>
  <text class="t" x="320" y="156">Baca tugas, kuis, uts, uas</text>

  <line class="line" x1="320" y1="186" x2="320" y2="220" marker-end="url(#ar-nilai)"/>

  <rect class="box" x="150" y="226" width="340" height="92"/>
  <text class="t" x="320" y="260">kontribusi &#8592; tugas &#215; 20 + kuis &#215; 20</text>
  <text class="t" x="320" y="286">+ uts &#215; 25 + uas &#215; 35</text>

  <line class="line" x1="320" y1="318" x2="320" y2="352" marker-end="url(#ar-nilai)"/>

  <rect class="box" x="150" y="358" width="340" height="62"/>
  <text class="t" x="320" y="390">nilai_akhir &#8592; kontribusi &#247; 100</text>

  <line class="line" x1="320" y1="420" x2="320" y2="454" marker-end="url(#ar-nilai)"/>

  <polygon class="io" points="168,460 490,460 472,522 150,522"/>
  <text class="t" x="320" y="492">Tulis nilai_akhir</text>

  <line class="line" x1="320" y1="522" x2="320" y2="556" marker-end="url(#ar-nilai)"/>

  <rect class="start" x="150" y="562" width="340" height="54" rx="27"/>
  <text class="t" x="320" y="590">Selesai</text>
</svg>
